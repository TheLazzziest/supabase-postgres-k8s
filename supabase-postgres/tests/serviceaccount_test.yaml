# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json

suite: ServiceAccount Tests
templates:
  - serviceaccount.yaml

tests:
  - it: should create service account for HA mode
    set:
      variant: postgres
      architecture:
        type: ha
        ha:
          replicas: 3
          serviceAccount:
            annotations: {}
            name: ""
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-supabase-postgres
