{{- if eq .Values.architecture.type "ha" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase-postgres.fullname" . }}
  labels:
    {{- include "supabase-postgres.labels" . | nindent 4 }}
  {{- with .Values.architecture.ha.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
